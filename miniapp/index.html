<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#141514"><meta name="color-scheme" content="dark">
  <link rel="manifest" href="/manifest.webmanifest"><link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/app.css"><title>AI DJ — моя музыка</title>
  <script src="/telegram-web-app.js"></script><script type="module" src="/app.mjs"></script>
</head>
<body>
  <header class="topbar"><a class="brand" href="/" aria-label="AI DJ, главная"><span class="brand-mark">a<span>i</span></span> DJ</a><span id="connection" class="connection"></span><button id="settings" class="icon-button" aria-label="Настройки"></button></header>
  <main id="main" tabindex="-1"></main>
  <aside id="downloads-progress" class="downloads-progress" hidden></aside>
  <section id="mini-player" class="mini-player" aria-label="Плеер" hidden>
    <div class="mini-progress"><span id="mini-progress-fill"></span></div>
    <button id="now-playing" class="now-playing"><span id="mini-art" class="track-art">♪</span><span class="song-text"><strong id="mini-title"></strong><span id="mini-artist"></span></span></button>
    <button id="mini-play" class="icon-button" aria-label="Воспроизвести"></button><button id="mini-next" class="icon-button" aria-label="Следующая песня"></button>
  </section>
  <nav class="bottom-nav" aria-label="Навигация"><button data-view="home" class="active"></button><button data-view="discover"></button><button data-view="saved"></button><button data-view="queue"></button></nav>
  <dialog id="sheet" class="sheet"><div id="sheet-content"></div></dialog>
  <dialog id="full-player" class="full-player"><div id="full-content"></div></dialog>
  <div id="toast" class="toast" role="status" hidden></div>
  <audio id="audio" preload="none"></audio>
</body></html>
